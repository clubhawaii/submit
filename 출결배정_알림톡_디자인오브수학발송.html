<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인오브수학 · 알림톡 안내</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#2B3450; --deep:#1F2740; --paper:#F7F5F0; --line:#E3DFD6; --soft:#6B675F;
  --kk:#a4bdd4;
}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic',sans-serif;
  background:var(--paper);color:var(--deep);-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:44px 22px 64px}

/* ── 헤더 ── */
.head{text-align:center;margin-bottom:14px}
.head img{height:78px;width:auto;margin-bottom:22px}
.head h1{font-size:25px;font-weight:700;color:var(--navy);letter-spacing:-.4px;margin-bottom:9px}
.head p{font-size:14.5px;color:var(--soft);line-height:1.7;font-weight:500}
.rule{width:44px;height:3px;background:var(--navy);border-radius:2px;margin:22px auto 0}

/* ── 무대(버튼 + 폰) ── */
.stage{display:flex;gap:46px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-top:44px}

/* 버튼 패널 */
.panel{flex:1;min-width:300px;max-width:400px}
.grp{margin-bottom:26px}
.grp-title{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.grp-title b{font-size:15.5px;font-weight:700;color:var(--navy);letter-spacing:-.2px}
.grp-title span{font-size:12px;color:var(--soft);font-weight:500}
.picks{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 15px;
  font-family:inherit;font-size:14px;font-weight:600;color:var(--deep);letter-spacing:-.2px;
  transition:all .15s ease}
.pick .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex-shrink:0;transition:all .15s}
.pick:hover{border-color:#c7bfae;background:#fffdf8}
.pick.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 6px 16px -6px rgba(43,52,80,.5)}
.pick.on .dot{background:#FEE500}

.sec-label{font-size:11.5px;font-weight:700;color:var(--soft);letter-spacing:.6px;text-transform:uppercase;margin:0 0 11px;padding-left:2px}
.sec-label:not(:first-child){margin-top:30px}

/* 폰 열 */
.phone-col{position:sticky;top:24px;flex-shrink:0}

/* ── 폰 목업 ── */
.phone{width:320px;background:#1a1d24;border-radius:36px;padding:11px;
  box-shadow:0 22px 46px -16px rgba(31,39,64,.34), 0 3px 10px rgba(31,39,64,.12)}
.screen{background:var(--kk);border-radius:26px;overflow:hidden;position:relative}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:98px;height:21px;background:#1a1d24;border-radius:0 0 13px 13px;z-index:5}

/* 채팅 헤더 */
.kk-bar{background:var(--kk);padding:35px 15px 12px;display:flex;align-items:center;gap:9px}
.kk-bar .back{color:#33404f;font-size:20px;line-height:1;font-weight:600}
.kk-bar .who{font-size:15.5px;font-weight:700;color:#26313d;letter-spacing:-.3px}
.kk-bar .menu{margin-left:auto;color:#4a5866;font-size:18px;letter-spacing:2px}

/* 채팅 본문 */
.kk-body{padding:14px 13px 22px;min-height:360px}
.datepill{margin:2px auto 16px;width:fit-content;background:rgba(51,64,79,.18);color:#2c3742;
  font-size:11px;font-weight:600;border-radius:999px;padding:4px 13px}

.msgrow{display:flex;gap:8px;align-items:flex-start;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.avatar{flex-shrink:0;width:39px;height:39px;border-radius:13px;background:#fff;border:1px solid rgba(43,52,80,.12);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.avatar img{height:29px;width:auto}
.msgcol{display:flex;flex-direction:column;gap:5px;max-width:238px}
.sender{font-size:11.5px;color:#33404f;font-weight:600;padding-left:2px}

.bubble{background:#fff;border-radius:4px 16px 16px 16px;overflow:hidden;box-shadow:0 1px 2px rgba(31,39,64,.1)}
.bub-title{padding:14px 15px 0;font-size:14.5px;font-weight:700;color:var(--navy);white-space:pre-wrap;line-height:1.4}
.bub-body{padding:9px 15px 15px;font-size:13px;line-height:1.62;color:#2c333f;white-space:pre-wrap;word-break:keep-all}
.bub-btn{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;
  font-size:13px;font-weight:600;color:var(--navy);background:#f3f2ee;border-top:1px solid #ececec;padding:12px}
.stamp{font-size:10px;color:#4a5866;align-self:flex-end;padding-bottom:2px}

b.v{font-weight:700;color:var(--deep)}

.foot{margin-top:56px;text-align:center;font-size:12px;color:#a8a498;line-height:1.7}
.foot img{height:34px;opacity:.5;margin-bottom:12px;display:block;margin-left:auto;margin-right:auto}

@media (max-width:820px){
  .stage{flex-direction:column-reverse;align-items:center;gap:34px}
  .phone-col{position:static}
  .panel{max-width:340px;width:100%}
}
@media print{
  body{background:#fff}
  .phone{box-shadow:none;border:1px solid var(--line)}
}
</style></head>

let current = 0;

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(t){
  return esc(t)
    .replace(/@student/g, esc(STUDENT))
    .replace(/@teacher/g, esc(TEACHER))
    .replace(/@@([^@]+)@@/g, '<b class="v">$1</b>');
}
function showMsg(i){
  current = i;
  const m = MSGS[i];
  const btn = m.btn ? `<div class="bub-btn">📞 ${esc(m.btn)}</div>` : '';
  document.getElementById('kkbody').innerHTML = `
    <div class="datepill">${esc(m.date)}</div>
    <div class="msgrow" key="${i}">
      <div class="avatar"><img src="${LOGO}" alt=""></div>
      <div class="msgcol">
        <div class="sender">디자인오브수학</div>
        <div class="bubble">
          <div class="bub-title">${fmt(m.title)}</div>
          <div class="bub-body">${fmt(m.body)}</div>
          ${btn}
        </div>
      </div>
      <div class="stamp">${esc(m.stamp)}</div>
    </div>`;
  document.querySelectorAll('.pick').forEach(b=>b.classList.toggle('on', +b.dataset.i===i));
}
function buildPicks(g, el){
  MSGS.forEach((m,i)=>{
    if(m.g!==g) return;
    const b = document.createElement('button');
    b.className='pick'; b.dataset.i=i;
    b.innerHTML = `<span class="dot"></span>${esc(m.label)}`;
    b.addEventListener('click',()=>showMsg(i));
    el.appendChild(b);
  });
}
buildPicks('att', document.getElementById('picks-att'));
buildPicks('urgent', document.getElementById('picks-urgent'));
buildPicks('oper', document.getElementById('picks-oper'));
buildPicks('pay', document.getElementById('picks-pay'));
buildPicks('study', document.getElementById('picks-study'));
buildPicks('report', document.getElementById('picks-report'));
buildPicks('event', document.getElementById('picks-event'));
buildPicks('consult', document.getElementById('picks-consult'));
buildPicks('remind', document.getElementById('picks-remind'));
buildPicks('onboard', document.getElementById('picks-onboard'));
buildPicks('asg', document.getElementById('picks-asg'));
buildPicks('staff', document.getElementById('picks-staff'));
showMsg(0);
</script>
